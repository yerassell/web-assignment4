<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles3.css">
    <title>Part 3</title>
</head>
<body>
    <nav class="navbar">
        <div class="nav">
            <a href="index.html">Part 1</a>
        </div>
        <div class="nav">
            <a href="part2.html">Part 2</a>
        </div>
        <div class="nav">
            <a href="part3.html">Part 3</a>
        </div>
    </nav>
    <div class="container">
        <form class="row g-3 needs-validation" novalidate>
            <h1>Registration Form</h1>
            <div class="col-md-4">
                <label for="fname" class="form-label">First name</label>
                <input type="text" class="form-control" id="fname" placeholder="Enter your firstname" required>
                <div class="invalid-feedback">Firstname is required!</div>
                <div class="valid-feedback">Looks good!</div>
            </div>
            <div class="col-md-4">
                <label for="sname" class="form-label">Last name</label>
                <input type="text" class="form-control" id="sname" placeholder="Enter your lastname" required>
                <div class="invalid-feedback">Lastname is required!</div>
                <div class="valid-feedback">Looks good!</div>
            </div>
            <div class="col-md-4">
                <label for="email" class="form-label">Email:</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                <div class="invalid-feedback">Include @!</div>
                <div class="valid-feedback">Looks good!</div>
            </div>
            <div class="col-md-6">
                <label for="pwd" class="form-label">Password:</label>
                <input type="password" class="form-control" id="pwd" minlength="8" placeholder="Enter your password (min 8 character)" name="pwd" required>
                <div class="invalid-feedback">Password must be at least of 8 characters.</div>
                <div class="valid-feedback">Looks good!</div>
            </div>
            <div class="col-md-6">
                <label for="confirm" class="form-label">Confirm Password:</label>
                <input type="password" class="form-control" id="confirm" minlength="8" placeholder="Confirm your password" name="confirm" required>
                <div class="invalid-feedback">Password must be at least of 8 characters.</div>
                <div class="valid-feedback">Looks good!</div>
            </div>
             <div class="col-4">
                <label class="form-label d-block">Gender</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="male" value="male" required>
                    <label class="form-check-label" for="male">Male</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="female" value="female">
                    <label class="form-check-label" for="female">Female</label>
                </div>
            </div>
            <div class="col-4">
                <label class="form-label d-block">Hobbies</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="dance" value="dance">
                    <label class="form-check-label" for="dance">Dance</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="books" value="books">
                    <label class="form-check-label" for="books">Reading books</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="music" value="music">
                    <label class="form-check-label" for="music">Listening to music</label>
                </div>
            </div>
            <div class="col-4">
                <label for="country" class="form-label">Country</label>
                <select class="form-select" id="country" required>
                    <option selected value="">Choose your country</option>
                    <option  value="Austria">Austria</option>
                    <option value="Kazakhstan">Kazakhstan</option>
                    <option value="Russia">Russia</option>
                    <option value="China">China</option>
                    <option value="France">France</option>
                    <option value="other">...</option>
                </select>
                <div class="invalid-feedback">
                Please select a valid state.
                </div>
            </div>
            <div class="col-12 text-center">
                <button class="btn btn-primary" type="submit">Submit</button>
                <button class="btn btn-secondary" type="reset">Reset</button>
            </div>
        </form>
        </div>
        <script>
            (() => {
            'use strict'
            const forms = document.querySelectorAll('.needs-validation')
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
                }, false)
            })
            })()
        </script>
</body>    
</html>
