    <form>
        <h1>Contact Form</h1>
        <div class="row">
            <div class="r1">
                <label for="name">Name: </label>
                <input type="text" id="name" name="name" minlength="2" maxlength="15" placeholder="Enter your name" required>
            </div>
            <div class="r2">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
        </div>
        <label for="msg">Message:</label>
        <textarea id="msg" name="msg" placeholder="Type something... (maximum 500 characters)" maxlength="500" required></textarea>
        <label><input type="submit" id="submit" name="submit" value="Submit"></label>
    </form>
</body>    
</html>
